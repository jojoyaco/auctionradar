name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    env:
      PIP_DISABLE_PIP_VERSION_CHECK: '1'
      PIP_NO_INPUT: '1'
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install hash-pinned runtime dependencies
        run: python -m pip install --require-hashes -r requirements.txt

      - name: Run Python test suite
        run: python -W error::ResourceWarning -m unittest discover -s tests -v

      - name: Check installed dependencies
        run: python -m pip check

      - name: Set up Node.js for Python 3.13 checks
        if: matrix.python-version == '3.13'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'

      - name: Install hash-pinned CI tools
        if: matrix.python-version == '3.13'
        run: |
          python -m pip install --only-binary=:all: --require-hashes -r requirements-ci.txt

      - name: Check Python style
        if: matrix.python-version == '3.13'
        run: |
          ruff check auctionradar tests deploy/product/package.py deploy/proxmox/install.py
          ruff format --check auctionradar tests deploy/product/package.py deploy/proxmox/install.py

      - name: Check JavaScript and shell syntax
        if: matrix.python-version == '3.13'
        run: |
          for file in auctionradar/web/static/*.js tests/*.js tests/*.cjs; do
            node --check "$file"
          done
          bash -n install.sh deploy/product/create-lxc.sh deploy/product/install-lxc.sh deploy/product/auctionradar-create-admin

      - name: Run Node.js unit tests
        if: matrix.python-version == '3.13'
        run: |
          node tests/ui_preferences.test.cjs
          node tests/review_detail_handler.test.cjs
          node tests/detail_next_handler.test.cjs
          node tests/language_change.test.cjs

      - name: Build and smoke-test the Python wheel
        if: matrix.python-version == '3.13'
        run: |
          mkdir -p "$RUNNER_TEMP/auctionradar-wheels"
          python -m pip wheel --no-build-isolation --no-deps \
            --wheel-dir "$RUNNER_TEMP/auctionradar-wheels" .
          python -m pip install --no-deps --target "$RUNNER_TEMP/auctionradar-wheel-install" \
            "$RUNNER_TEMP"/auctionradar-wheels/*.whl
          (
            cd "$RUNNER_TEMP"
            PYTHONPATH="$RUNNER_TEMP/auctionradar-wheel-install" \
              python -m auctionradar.cli --help
          )

      - name: Install Playwright Core
        if: matrix.python-version == '3.13'
        run: npm install --global --ignore-scripts --no-audit --no-fund playwright-core@1.64.1

      - name: Run all real-browser checks
        if: matrix.python-version == '3.13'
        run: |
          export AUCTIONRADAR_TEST_PYTHON="$(command -v python)"
          export AUCTIONRADAR_TEST_CHROME="$(command -v google-chrome)"
          export NODE_PATH="$(npm root --global)"
          node tests/run_browser_checks.cjs --all
          node tests/public_share_image_policy.test.cjs

  dependency-audit:
    name: Python dependency audit
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'

      - name: Audit hash-pinned runtime and CI requirements
        uses: pypa/gh-action-pip-audit@fb241f581674a1bb995061d62504857a9ea4b69e # upstream main snapshot; includes disable-pip input
        with:
          inputs: requirements.txt requirements-ci.txt
          require-hashes: true
          disable-pip: true
          internal-be-careful-extra-flags: --strict

  secret-scan:
    name: Full-history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download and verify Gitleaks 8.30.1
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/gitleaks_8.30.1_linux_x64.tar.gz"
          curl --fail --silent --show-error --location --retry 3 \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $archive" \
            | sha256sum --check --strict
          tar -xzf "$archive" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" version

      - name: Scan all Git history with redacted output
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --log-opts='--all' --ignore-gitleaks-allow .
